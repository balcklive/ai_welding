name: CI and ACR Docker Deploy

on:
  push:
    branches: [main]
    # 纯文档提交不触发构建/发布（Dockerfile 不 COPY docs，镜像内容不受影响）。
    # 含代码的提交只要有一个非忽略路径变更，仍会正常触发。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  ACR_REGISTRY: crpi-v5j14rjtcacf9f23.cn-shanghai.personal.cr.aliyuncs.com
  ACR_REPOSITORY: aliyun_kaka/ai_welding

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  build-and-push:
    name: Build and push image to Aliyun ACR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 清理 Actions 缓存需要 actions: write（`gh cache delete`）；只用仓库自带 GITHUB_TOKEN，
      # 不引入额外 secret。
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit 缓存用 **GitHub Actions cache**（type=gha），配合下一步的**自动清理**：
          # 配额被旧缓存塞满是当初改走 ACR 的原因，而 ACR 那条路两条形式都不通（见
          # .github/workflows/CLAUDE.md 的 2026-09-28 实测记录），所以回到已知可用的 gha，
          # 并用「只保留最近 N 条 / 总量封顶」把存储压住。
          # `scope` 固定成一个常量：缓存键前缀可预测（buildcache-…），清理规则才敢按家族收敛；
          # 默认 scope 是分支名，键前缀会随分支漂移。
          cache-from: type=gha,scope=buildcache
          cache-to: type=gha,mode=max,scope=buildcache

      # 缓存清理：把 Actions 缓存压到"够快且不涨"的量级。三条规则，全在 build 之后跑：
      #   ① 构建索引 `index-buildcache-1-<hash>#1`：每次构建一条，旧的没有任何用处 → 只留最新 2 条；
      #   ② 每个"缓存家族"只留最新 KEEP_PER_FAMILY 条（家族 = 键去掉尾部哈希段，
      #      如 npm 的 `node-cache-Linux-x64-npm-<sha>`）；
      #   ③ 总量超过 MAX_TOTAL_MB 时从**最旧**的开始删，直到压到上限以内。
      # **注意键的真实形状**（2026-09-28 实测）：BuildKit 的 gha 缓存不是一个键一坨，而是
      # 「每次构建一个索引 + 一堆内容寻址分块」——分块键是
      # `buildkit-blob-1-sha256:<digest>`（含冒号，所以"去掉尾部哈希段"的正则认不出它，
      # 靠 ①③ 兜底；同内容的分块天然同键、不会重复堆积）。
      # 1 小时内新建的条目一律不动（保护本次构建刚写进去的缓存）。`if: always()`：
      # 构建失败/被取消也要清，否则失败轮次留下的缓存会越攒越多。
      - name: Prune Actions caches
        if: always()
        # 清理是维护动作，**绝不能因为它失败而挡住发布**（本 job 失败 → deploy 不执行）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_PER_FAMILY: "2"
          KEEP_INDEXES: "2"
          MAX_TOTAL_MB: "1600"
        run: |
          set -uo pipefail
          drop() {  # 删除一批 id（失败只告警，不中断清理）
            while read -r id; do
              [ -n "$id" ] && [ "$id" != "null" ] || continue
              gh cache delete "$id" && echo "pruned cache id=$id" || echo "skip cache id=$id"
            done
          }
          # ① 只留最新的构建索引
          gh cache list --limit 100 --json id,key,createdAt \
            --jq "map(select(.key | startswith(\"index-buildcache\"))) | sort_by(.createdAt) | reverse | .[$KEEP_INDEXES:] | .[].id" | drop
          # ② 每个缓存家族只留最新 N 条
          gh cache list --limit 100 --json id,key,createdAt \
            --jq "sort_by(.createdAt) | reverse | group_by(.key | sub(\"-[0-9a-fA-F]{8,}$\"; \"\")) | map(.[$KEEP_PER_FAMILY:] | .[]) | .[].id" | drop
          # ③ 总量封顶：只删 1 小时前创建的条目（不动本次构建的产物）
          # 比较到"分钟"（`.createdAt[0:16]`）——gh 给的时间带 6 位小数，
          # 直接与 `…:00Z` 逐字符比会在"同一秒"的边界上判错。
          cutoff="$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M)"
          for _ in $(seq 1 40); do
            total="$(gh cache list --limit 100 --json sizeInBytes --jq 'map(.sizeInBytes) | add // 0')"
            if [ "$total" -le $((MAX_TOTAL_MB * 1048576)) ]; then break; fi
            # 优先淘汰 BuildKit 分块（真正占地方的），再轮到其它——否则 npm 缓存会被反复
            # 删/建，白搭一分钟 npm ci。
            oldest="$(gh cache list --limit 100 --json id,key,createdAt \
              --jq "map(select(.createdAt[0:16] < \"$cutoff\")) | sort_by((if (.key | startswith(\"buildkit-blob\")) then 0 else 1 end), .createdAt) | .[0].id // empty")"
            [ -n "$oldest" ] || break
            gh cache delete "$oldest" && echo "pruned oldest cache id=$oldest (total $((total / 1048576))MB)" || break
          done
          gh cache list --limit 100 --json key,sizeInBytes --jq '"Actions cache now: \(length) entries / \(map(.sizeInBytes) | add // 0 | . / 1048576 | floor) MB"'

  deploy:
    name: Deploy pulled image
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 把 docker-compose.yml 同步到服务器（编排 label-studio / mlflow 辅助服务，
      # 见 docs/superpowers/plans/2026-09-05-compose-deploy.md）
      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ vars.DEPLOY_PATH || '/home/wwwroot/code/ai_welding' }}

      - name: Pull and run image over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/wwwroot/code/ai_welding' }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME || 'ai-welding' }}
          HOST_PORT: ${{ vars.HOST_PORT || '8223' }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ env.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,APP_CONTAINER_NAME,HOST_PORT,ACR_REGISTRY,ACR_REPOSITORY,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"
            test -f .env

            IMAGE_NAME="$ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG"
            CANDIDATE_CONTAINER="${APP_CONTAINER_NAME}-candidate"
            BACKUP_CONTAINER="${APP_CONTAINER_NAME}-rollback"
            READY_PATH="/api/v1/health/ready"

            wait_ready() {
              HEALTH_URL="$1"
              CONTAINER="$2"
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error \
                  --connect-timeout 2 --max-time 5 \
                  "$HEALTH_URL" >/dev/null; then
                  echo "Readiness passed: $CONTAINER"
                  return 0
                fi
                if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -q true; then
                  echo "Container exited before readiness passed: $CONTAINER"
                  return 1
                fi
                echo "Readiness check failed (${attempt}/30): $CONTAINER"
                sleep 2
              done
              return 1
            }

            rollback_previous() {
              echo "Rolling back to previous application container..."
              docker rm -f "$APP_CONTAINER_NAME" 2>/dev/null || true
              if docker inspect "$BACKUP_CONTAINER" >/dev/null 2>&1; then
                docker rename "$BACKUP_CONTAINER" "$APP_CONTAINER_NAME"
                docker start "$APP_CONTAINER_NAME"
                if wait_ready \
                  "http://127.0.0.1:${HOST_PORT}${READY_PATH}" \
                  "$APP_CONTAINER_NAME"; then
                  echo "Rollback completed: $APP_CONTAINER_NAME"
                else
                  echo "Rollback container failed readiness; manual intervention required"
                  docker logs --tail 200 "$APP_CONTAINER_NAME" 2>/dev/null || true
                fi
              else
                echo "No previous container is available for rollback"
              fi
            }

            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME"

            # 确保外部网络 + 辅助服务（label-studio / mlflow）在跑（幂等；docker-compose.yml 已由 scp 步骤同步）。
            # 辅助服务失败不阻断 app 发布：MLflow 写入本就是 best-effort。
            docker network create aiwelding-net >/dev/null 2>&1 || true
            docker compose up -d >/dev/null 2>&1 || echo "compose up 警告：辅助服务未就绪（不阻断 app 发布）"

            # 候选容器先在随机本地端口执行迁移和 readiness。禁用任务执行器，避免
            # 与当前生产容器同时消费队列。此阶段失败不会触碰当前生产容器。
            docker rm -f "$CANDIDATE_CONTAINER" 2>/dev/null || true
            if ! docker run -d \
              --name "$CANDIDATE_CONTAINER" \
              --env-file .env \
              -e JOB_EXECUTOR_ENABLED=false \
              --restart no \
              --network aiwelding-net \
              -p 127.0.0.1::8000 \
              "$IMAGE_NAME"; then
              docker logs --tail 200 "$CANDIDATE_CONTAINER" 2>/dev/null || true
              exit 1
            fi

            CANDIDATE_PORT=$(docker port "$CANDIDATE_CONTAINER" 8000/tcp | awk -F: 'NR == 1 {print $NF}')
            if [ -z "$CANDIDATE_PORT" ] || ! wait_ready \
              "http://127.0.0.1:${CANDIDATE_PORT}${READY_PATH}" \
              "$CANDIDATE_CONTAINER"; then
              docker logs --tail 200 "$CANDIDATE_CONTAINER" 2>/dev/null || true
              docker rm -f "$CANDIDATE_CONTAINER" 2>/dev/null || true
              exit 1
            fi
            docker rm -f "$CANDIDATE_CONTAINER"

            # 预检通过后才释放生产端口。当前容器保留为 rollback 副本；成功发布后
            # 继续保留到下一次发布，便于人工或自动回退。
            if docker inspect "$APP_CONTAINER_NAME" >/dev/null 2>&1; then
              docker rm -f "$BACKUP_CONTAINER" 2>/dev/null || true
              docker stop -t 30 "$APP_CONTAINER_NAME"
              docker rename "$APP_CONTAINER_NAME" "$BACKUP_CONTAINER"
            fi

            if ! docker run -d \
              --name "$APP_CONTAINER_NAME" \
              --env-file .env \
              --restart unless-stopped \
              --network aiwelding-net \
              -p "$HOST_PORT:8000" \
              "$IMAGE_NAME"; then
              docker logs --tail 200 "$APP_CONTAINER_NAME" 2>/dev/null || true
              rollback_previous
              exit 1
            fi

            if ! wait_ready \
              "http://127.0.0.1:${HOST_PORT}${READY_PATH}" \
              "$APP_CONTAINER_NAME"; then
              docker logs --tail 200 "$APP_CONTAINER_NAME" 2>/dev/null || true
              rollback_previous
              exit 1
            fi

            # 清理本仓库旧镜像，防止历次发布在服务器上堆积。只保留当前容器和
            # rollback 容器正在使用的两个镜像（按镜像 ID 判断，与 tag 无关），
            # 其余一律删除；顺带清理悬空层。
            CURRENT_IMAGE_ID=$(docker inspect -f '{{.Image}}' "$APP_CONTAINER_NAME")
            ROLLBACK_IMAGE_ID=$(docker inspect -f '{{.Image}}' "$BACKUP_CONTAINER" 2>/dev/null || true)
            docker images --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
              "$ACR_REGISTRY/$ACR_REPOSITORY" | \
              while read -r STALE_IMAGE_ID STALE_IMAGE_REF; do
                if [ "$STALE_IMAGE_ID" = "$CURRENT_IMAGE_ID" ] || \
                  [ "$STALE_IMAGE_ID" = "$ROLLBACK_IMAGE_ID" ]; then
                  echo "Keep image in use: $STALE_IMAGE_REF ($STALE_IMAGE_ID)"
                  continue
                fi
                echo "Removing stale image: $STALE_IMAGE_REF ($STALE_IMAGE_ID)"
                docker rmi "$STALE_IMAGE_REF" >/dev/null 2>&1 || true
              done
            docker image prune -f >/dev/null 2>&1 || true

            printf '\nDocker deployment ready: %s (%s)\n' "$APP_CONTAINER_NAME" "$IMAGE_TAG"
