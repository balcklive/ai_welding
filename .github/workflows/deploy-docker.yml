name: CI and ACR Docker Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  ACR_REGISTRY: crpi-v5j14rjtcacf9f23.cn-shanghai.personal.cr.aliyuncs.com
  ACR_REPOSITORY: aliyun_kaka/ai_welding

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  build-and-push:
    name: Build and push image to Aliyun ACR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy pulled image
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and run image over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/wwwroot/code/ai_welding' }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME || 'ai-welding' }}
          HOST_PORT: ${{ vars.HOST_PORT || '8223' }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ env.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,APP_CONTAINER_NAME,HOST_PORT,ACR_REGISTRY,ACR_REPOSITORY,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"
            test -f .env

            IMAGE_NAME="$ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG"
            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME"

            docker stop "$APP_CONTAINER_NAME" 2>/dev/null || true
            docker rm "$APP_CONTAINER_NAME" 2>/dev/null || true
            if ! docker run -d \
              --name "$APP_CONTAINER_NAME" \
              --env-file .env \
              --restart unless-stopped \
              -p "$HOST_PORT:8000" \
              "$IMAGE_NAME"; then
              docker logs --tail 200 "$APP_CONTAINER_NAME" 2>/dev/null || true
              exit 1
            fi

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused \
              "http://127.0.0.1:${HOST_PORT}/api/v1/health"; then
              docker logs --tail 200 "$APP_CONTAINER_NAME" || true
              exit 1
            fi
            printf '\nDocker deployment healthy: %s\n' "$APP_CONTAINER_NAME"
